quant:
  dataset:
    calib_path: ./tmp_res/dataset_5.txt
  activation:
    algorithm: MaxMin
    symmetric: false
    quant_type: S8
  weight:
    algorithm: MaxMin
    quant_type: S8
    per_channel: false
executor:
  enable_gpu: false
  cpu_settings:
    thread_num: 4
  gpu_settings:
    dev_id: 1
inputs:
  - input_name: input
    calib_type: Image
    input_type: Image
    reverse_rgb_order: false
    data_layout: NCHW
    shape: [1, 3, 416, 416]
    preprocess:
      preprocess_input_type: YUV420SP
      preprocess_output_type: RGBPlanar
      resize:
        letter_box: true
        height: 416
        width: 416
      dtc:
        mean: [0, 0, 0]
        std: [1, 1, 1]
