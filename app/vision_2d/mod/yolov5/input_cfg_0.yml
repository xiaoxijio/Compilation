quant:
  dataset:
    calib_path: ./tmp_res/quant_dataset/coco2017_50.txt
    # calib_data_num: 1  
  activation:
    algorithm: percentile
    symmetric: false
    quant_type: S8
    percent: 0.99999
  weight:
    algorithm: MaxMin
    quant_type: S8
    per_channel: true

executor:
  cpu_settings:
    thread_num: 4
  gpu_settings:
    dev_id: 0
inputs:
- input_name: images
  calib_type: image
  input_type: image
  reverse_rgb_order: false
  data_layout: NCHW
  shape:
  - 1
  - 3
  - 640
  - 640
  preprocess:
    preprocess_input_type: YUV420SP
    preprocess_output_type: RGBPlanar
    resize:
      letter_box: true
      height: 640
      width: 640
    dtc:
      embeded_to_model: true
      mean:
      - 0
      - 0
      - 0
      std:
      - 1
      - 1
      - 1
      
add_postprocess:
  - postprocess_type: detection
    image_h: 640 
    image_w: 640
    model_type: yolov5
    nms_threshold: 0.5 
    low_score_threshold: 0.25
    detection_head:
      - head_input_name: [/model.24/m.0/Conv_output_0,/model.24/m.1/Conv_output_0,/model.24/m.2/Conv_output_0]
        topK: 100
        num_classes: 80
        anchor_size: [[10,13,16,30,33,23],[30,61,62,45,59,119],[116,90,156,198,373,326]]