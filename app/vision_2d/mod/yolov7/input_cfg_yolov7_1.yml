quant:
# dataset.txt为量化时参考的图片路径
# data为单输入时不做检查，多输入时要和inputs顺序保持一致
  dataset:
    calib_path: ./tmp_res/quant_dataset/coco2017_50.txt
    # calib_data_num: 1

  activation:
    algorithm: percentile
    symmetric: false
    quant_type: "S8"
    percent: 0.99999
  weight:
    algorithm: MaxMin
    quant_type: "S8"
    per_channel: auto

  quant_tensors:
    - tensor_name: /model.105/m.0/Conv_output_0_sigmoid
      quant_type: fp16
    - tensor_name: /model.105/m.1/Conv_output_0_sigmoid
      quant_type: fp16
    - tensor_name: /model.105/m.2/Conv_output_0_sigmoid
      quant_type: fp16
    - tensor_name: /model.105/m.0/Conv_output_0
      quant_type: fp16
    - tensor_name: /model.105/m.1/Conv_output_0
      quant_type: fp16
    - tensor_name: /model.105/m.2/Conv_output_0
      quant_type: fp16
      
executor:
  cpu_settings:
    thread_num: 4
  gpu_settings:
    dev_id: 0
inputs:
- input_name: images
  calib_type: Image
  input_type: Image
  reverse_rgb_order: false
  data_layout: NCHW
  shape:
  - 1
  - 3
  - 640
  - 640
  preprocess:
    preprocess_input_type: YUV420SP
    preprocess_output_type: RGBPlanar
    resize:
      letter_box: true
      height: 640
      width: 640
    dtc:
      embeded_to_model: true
      mean:
      - 0
      - 0
      - 0
      std:
      - 1
      - 1
      - 1

outputs:
- output_name: /model.105/m.0/Conv_output_0_sigmoid
  data_type: fp16
- output_name: /model.105/m.1/Conv_output_0_sigmoid
  data_type: fp16
- output_name: /model.105/m.2/Conv_output_0_sigmoid
  data_type: fp16
