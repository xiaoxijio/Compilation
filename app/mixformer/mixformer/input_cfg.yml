quant:
  dataset:
    calib_path: ./dataset.txt
    quant_batch_size: 1
  activation:
    algorithm: percentile
    symmetric: false
    quant_type: S8
    percent: 0.99999
  weight:
    algorithm: MaxMin
    quant_type: S8
    per_channel: true
executor:
  enable_gpu: false
  cpu_settings:
    thread_num: 4
  gpu_settings:
    dev_id: 1
inputs:
- input_name: img_t
  calib_type: Binary
  input_type: Binary
  reverse_rgb_order: false
  data_layout: NCHW
  shape:
  - 1
  - 3
  - 112
  - 112
  preprocess:
    resize:
      letter_box: false
      height: 0
      width: 0
    crop:
      method: absolute
      height: 0
      width: 0
    dtc:
      mean:
      - 0.0
      - 0.0
      - 0.0
      std:
      - 1.0
      - 1.0
      - 1.0
- input_name: img_ot
  calib_type: Binary
  input_type: Binary
  reverse_rgb_order: false
  data_layout: NCHW
  shape:
  - 1
  - 3
  - 112
  - 112
  preprocess:
    resize:
      letter_box: false
      height: 0
      width: 0
    crop:
      method: absolute
      height: 0
      width: 0
    dtc:
      mean:
      - 0.0
      - 0.0
      - 0.0
      std:
      - 1.0
      - 1.0
      - 1.0
- input_name: img_search
  calib_type: Binary
  input_type: Binary
  reverse_rgb_order: false
  data_layout: NCHW
  shape:
  - 1
  - 3
  - 224
  - 224
  preprocess:
    resize:
      letter_box: false
      height: 0
      width: 0
    crop:
      method: absolute
      height: 0
      width: 0
    dtc:
      mean:
      - 0.0
      - 0.0
      - 0.0
      std:
      - 1.0
      - 1.0
      - 1.0
omg:
  internal_enable_dump_graph: false